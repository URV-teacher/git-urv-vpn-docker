# Builds and tests the image of the component, and installs and tests the component in an Ubuntu machine with the
# install scripts. The jobs are the reusable workflows of the bmde repository, shared by all the components.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  git-image:
    uses: URV-teacher/bmde/.github/workflows/component-image.yml@master
    with:
      image: aleixmt/git-sshpass
      dockerfile: git.Dockerfile
      tests: test_git.sh test_ssh.sh
    secrets: inherit

  vpn-image:
    uses: URV-teacher/bmde/.github/workflows/component-image.yml@master
    with:
      image: aleixmt/forticlient
      dockerfile: vpn.Dockerfile
      tests: test_vpn.sh
    secrets: inherit

  # test_operation.sh is not run: it needs the credentials of a user of the course
  host:
    uses: URV-teacher/bmde/.github/workflows/component-host.yml@master
    with:
      install: install_ssh.sh install_git.sh install_vpn.sh
      tests: test_git.sh test_ssh.sh test_vpn.sh
